<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh lam thắng cảnh</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>img{height:180px;object-fit:cover}</style>
</head>
<body class="bg-light">
<div class="container my-4">
  <h2 class="text-danger text-center mb-4">Danh lam thắng cảnh</h2>
  <div class="row g-4">
    <div class="col-sm-6 col-lg-4"><div class="card h-100 shadow-sm">
      <img src="Anh/Bai27/2-son-doong.jpg" class="card-img-top">
      <div class="card-body d-flex flex-column">
        <h5>Hang Sơn Đoòng</h5><p>Hang động tự nhiên lớn nhất thế giới.</p>
        <button class="btn btn-danger mt-auto" data-bs-toggle="modal" data-bs-target="#m">Chi tiết</button>
      </div>
    </div></div>
    <div class="col-sm-6 col-lg-4"><div class="card h-100 shadow-sm">
      <img src="Anh/Bai27/5-mekong.jpg" class="card-img-top">
      <div class="card-body d-flex flex-column">
        <h5>ĐBSCL</h5><p>Miệt vườn sông nước trù phú.</p>
        <button class="btn btn-danger mt-auto" data-bs-toggle="modal" data-bs-target="#m">Chi tiết</button>
      </div>
    </div></div>
    <div class="col-sm-6 col-lg-4"><div class="card h-100 shadow-sm">
      <img src="Anh/Bai27/6-phong-nha.jpg" class="card-img-top">
      <div class="card-body d-flex flex-column">
        <h5>Động Phong Nha</h5><p>Hệ thống hang động kỳ vĩ.</p>
        <button class="btn btn-danger mt-auto" data-bs-toggle="modal" data-bs-target="#m">Chi tiết</button>
      </div>
    </div></div>
  </div>

  <div class="accordion mt-4" id="acc">
    <div class="accordion-item">
      <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">Kinh nghiệm du lịch</button>
      <div id="a1" class="accordion-collapse collapse show" data-bs-parent="#acc">
        <div class="accordion-body">Chuẩn bị giấy tờ, đặt tour sớm, mang theo thuốc chống côn trùng.</div>
      </div>
    </div>
    <div class="accordion-item">
      <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#a2">Chi phí dự kiến</button>
      <div id="a2" class="accordion-collapse collapse" data-bs-parent="#acc">
        <div class="accordion-body">Khoảng 2–5 triệu đồng/người tùy điểm đến và số ngày.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="m">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 id="t"></h5></div>
    <div class="modal-body" id="b"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
      <button class="btn btn-danger">Đặt ngay</button>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
m.addEventListener('show.bs.modal', e => {
  t.textContent = e.relatedTarget.parentNode.children[0].textContent;
  b.textContent = e.relatedTarget.parentNode.children[1].textContent;
});
</script>
</body>
</html>
