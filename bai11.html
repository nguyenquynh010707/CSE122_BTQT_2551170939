<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="device-width,initial-scale=1.0">
    <title>Thư viện ảnh(figure/figcaption)</title>
    <link rel="stylesheet" href="bai11.css">
</head>
<body>
    <h1>Thư viện ảnh Việt Nam</h1>
    <p class="tieudephu">Bộ sưu tập 6 danh thắng tiêu biểu--minh họa thẻ figure/figcaption</p>
    <div class="noidung">
        <figure>
            <img src="1-vinh-ha-long.jpg" alt="1-vinh-ha-long">
            <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>
        <figure>
            <img src="2-son-doong.jpg" alt="2-son-doong">
            <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>
        <figure>
            <img src="3-thac-ban-gioc.jpg" alt="3-thac-ban-gioc">
            <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>
        <figure>
            <img src="4-fansipan.jpg" alt="4-fansipan">
            <figcaption>Hình 4. Fansipan</figcaption>
        </figure>
        <figure>
            <img src="5-mekong.jpg" alt="5-mekong">
            <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>
        <figure>
            <img src="6-phong-nha.jpg" alt="6-phong-nha">
            <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
    </div>
</body>
</html>
