<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="p-3 text-white" style="width:230px;min-height:100vh;background:#212529">
    <h6 class="fw-bold border-bottom pb-3">CSE.TLU Admin</h6>
    <div class="nav nav-pills flex-column">
      <a class="nav-link active" href="#">Bảng điều khiển</a>
      <a class="nav-link text-secondary" href="#">Bài tập</a>
      <a class="nav-link text-secondary" href="#">Sinh viên</a>
      <a class="nav-link text-secondary" href="#">Điểm số</a>
    </div>
  </nav>

  <main class="flex-grow-1 p-4" style="background:#e9ecef">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0">Bảng điều khiển</h4>
      <div><span class="badge bg-warning text-dark me-2">3 bài mới</span><button class="btn btn-primary btn-sm">Xuất báo cáo</button></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3">
        <small class="text-muted">Sinh viên</small><h3>128</h3>
        <div class="progress" style="height:6px"><div class="progress-bar" style="width:80%"></div></div>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3">
        <small class="text-muted">Đã nộp</small><h3>96</h3>
        <div class="progress" style="height:6px"><div class="progress-bar bg-success" style="width:75%"></div></div>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3">
        <small class="text-muted">Chưa nộp</small><h3>32</h3>
        <div class="progress" style="height:6px"><div class="progress-bar bg-danger" style="width:25%"></div></div>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3">
        <small class="text-muted">Điểm TB</small><h3>7.8</h3>
        <div class="progress" style="height:6px"><div class="progress-bar bg-warning" style="width:78%"></div></div>
      </div></div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-bold">Tiến độ theo chương</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between">Chương 1 — HTML5<span class="badge bg-success">100%</span></li>
        <li class="list-group-item d-flex justify-content-between">Chương 2 — JavaScript<span class="badge bg-info">82%</span></li>
        <li class="list-group-item d-flex justify-content-between">Chương 3 — CSS3<span class="badge bg-info">74%</span></li>
        <li class="list-group-item d-flex justify-content-between">Chương 4 — Bootstrap 5<span class="badge bg-secondary">45%</span></li>
      </ul>
    </div>
  </main>
</div>
</body>
</html>
