<!DOCTYPE html>
<html lang = "vi">
    <head>
        <meta charset = "UTF-8">
        <title>Trang thơ "Bốn mùa"</title>
        <style>
            body{
                background-color: white;
            }
            .khung{
                background-color: #FFFDE7;
                border: 2px soild #9E9E9E ;
                padding: 20px;
                width: 600px;
                margin: auto;
            }
            h1{
                color:  #D40000;
                background-color: #FFD9E6 ;
                text-align: center;
                font-weight: bold;
            }
            .kho1, .kho3{
                color: #0033CC ;
                font-style: italic;
                text-align: center;
            }
            .kho2{
                color:  #D40000 ;
                font-style: italic;
                text-align: center;
            }
            hr{
                width: 55%;
                border-color: #0033CC ;
            }
        </style>
    </head>
    <body>
        <div class = "khung">
            <header>
                <h1>BỐN MÙA</h1>
            </header>
            <div class = "kho1">
                <p>Xuân về hoa nở khắp trời</p>
                <p>Hạ sáng nắng chạy rạng ngời phố quen</p>
                <p>Thu về lá rụng bên thêm</p>
            </div>
            <hr>
            <div class = "kho2">
                <p>Đông sang gió lạnh bên em đợi chờ</p>
                <p>Bốn mùa là bốn giấc mơ</p>
                <p>Thời gian đi mãi ta chờ đợi ai</p>
            </div>
            <hr>
            <div class = "kho3">
                <p>Một năm rồi lại một năm</p>
                <p>Vẫn còn câu hát thì thầm quê hương</p>
                <p>Chờ xuân nắng mới soi đường</p>
            </div>
        </div>
    </body>
</html>
