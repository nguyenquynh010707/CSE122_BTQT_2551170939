<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm tra biểu mẫu bằng JavaScript</title>
  <link rel="stylesheet" href="bai17.css">
</head>

<body>

  <div id="the-form">

    <h1>Đăng ký tài khoản</h1>
    <p id="mo-ta">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>

    <form id="form-dang-ky" novalidate>

      <label for="ho-ten">Họ và tên</label>
      <input type="text" id="ho-ten">
      <div class="thong-bao" id="tb-ho-ten"></div>

      <label for="email">Email</label>
      <input type="text" id="email">
      <div class="thong-bao" id="tb-email"></div>

      <label for="mat-khau">Mật khẩu</label>
      <input type="password" id="mat-khau">
      <div class="thong-bao" id="tb-mat-khau"></div>

      <label for="xac-nhan">Xác nhận mật khẩu</label>
      <input type="password" id="xac-nhan">
      <div class="thong-bao" id="tb-xac-nhan"></div>

      <button type="submit" id="nut-dang-ky">Đăng ký</button>

    </form>
  </div>

  <script src="bai17.js"></script>
</body>
</html>
