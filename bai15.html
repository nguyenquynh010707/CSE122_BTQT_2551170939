<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="device-width,initical-scale=1.0">
  <title>Máy tính đơn giản(JavaScript)</title>
  <link rel="stylesheet" href="bai15.css">
</head>

<body>
  <div id="may-tinh">
    <div id="man-hinh">
      <div id="phep-tinh"></div>
      <div id="ket-qua">0</div>
    </div>
    <div id="ban-phim">
      <button class="nut xoa">C</button>
      <button class="nut phep">( )</button>
      <button class="nut phep">%</button>
      <button class="nut phep">÷</button>

      <button class="nut so">7</button>
      <button class="nut so">8</button>
      <button class="nut so">9</button>
      <button class="nut phep">×</button>

      <button class="nut so">4</button>
      <button class="nut so">5</button>
      <button class="nut so">6</button>
      <button class="nut phep">−</button>

      <button class="nut so">1</button>
      <button class="nut so">2</button>
      <button class="nut so">3</button>
      <button class="nut phep">+</button>

      <button class="nut so so-0">0</button>
      <button class="nut so">.</button>
      <button class="nut bang">=</button>
    </div>

  </div>

  <script src="bai15.js"></script>
</body>
</html>
